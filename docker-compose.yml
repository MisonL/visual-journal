name: visual-journal

services:
  visual-journal:
    build:
      context: .
      args:
        VCS_REF: ${VJ_IMAGE_REVISION:-unknown}
    image: visual-journal:${VJ_IMAGE_TAG:-local}
    container_name: visual-journal
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      APP_LOG_LEVEL: info
      AGENT_STATE_BACKEND: sqlite
      NEXT_PUBLIC_IMAGE_STORAGE_MODE: fs
      PORT: "4783"
      VJ_COMPOSE_DEPLOYMENT: "true"
      VJ_BIND_HOST: "${VJ_BIND_HOST:-127.0.0.1}"
    labels:
      org.opencontainers.image.revision: "${VJ_IMAGE_REVISION:-unknown}"
    ports:
      - "${VJ_BIND_HOST:-127.0.0.1}:${VJ_PORT:-4783}:4783"
    volumes:
      - ./generated-images:/app/generated-images
